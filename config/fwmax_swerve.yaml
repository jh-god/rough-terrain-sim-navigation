ground_pipeline:
  ros__parameters:
    use_sim_time: true
    input_topic: /sensors/os1_64/points
    input_frame_override: ''
    fixed_frame: navigation/odom
    physical_frame: base_link
    level_frame: navigation/lidar_level
    min_range: 0.8
    max_range: 15.0
    voxel_size: 0.08
    processing_timeout: 8.0
    max_input_age: 0.5
    self_x_min: -0.6
    self_x_max: 0.6
    self_y_min: -0.38
    self_y_max: 0.38
    self_z_min: -0.55
    self_z_max: 0.65
    max_relative_height: 2.5
command_gate:
  ros__parameters:
    use_sim_time: true
    output_topic: /cmd_vel
    timeout: 1.0
    command_timeout: 0.4
    max_linear_speed: 0.8
    max_angular_speed: 0.6
simulation_state_adapter:
  ros__parameters:
    use_sim_time: true
    input_topic: /ground_truth/odom
    expected_frame: world
    map_frame: map
    odom_frame: navigation/odom
    planar_frame: navigation/base
    physical_frame: base_footprint
