command_gate:
  ros__parameters:
    command_timeout: 0.4
    max_angular_speed: 1.0
    max_linear_speed: 1.0
    output_topic: /cmd_vel
    timeout: 1.0
    use_sim_time: true
ground_pipeline:
  ros__parameters:
    fixed_frame: navigation/odom
    input_frame_override: lidar3d_0_laser
    input_topic: /sensors/lidar3d_0/points
    level_frame: navigation/lidar_level
    max_input_age: 0.5
    max_range: 15.0
    max_relative_height: 2.5
    min_range: 0.8
    physical_frame: base_link
    processing_timeout: 8.0
    self_x_max: 0.3
    self_x_min: -0.3
    self_y_max: 0.25
    self_y_min: -0.25
    self_z_max: 0.55
    self_z_min: -0.15
    use_sim_time: true
    voxel_size: 0.08
simulation_state_adapter:
  ros__parameters:
    expected_frame: world
    input_topic: /ground_truth/odom
    map_frame: map
    odom_frame: navigation/odom
    physical_frame: base_link
    planar_frame: navigation/base
    use_sim_time: true
