# Sensor measurement height from expanded upstream URDF:
# base_footprint->base_link 0.382 + mount 0.505 + Ouster internals 0.060695 m.
# These are initial segmentation settings, not a calibrated traversability threshold.
patchworkpp:
  ros__parameters:
    use_sim_time: true
    cloud_topic: /navigation/patchwork/input
    frame_id: navigation/lidar_level
    adaptive_seed_selection_margin: -1.1
    sensor_height: 0.947695
    num_iter: 3
    num_lpr: 20
    num_min_pts: 6
    th_seeds: 0.15
    th_dist: 0.12
    th_seeds_v: 0.25
    th_dist_v: 0.1
    max_range: 15.0
    min_range: 0.8
    uprightness_thr: 0.707
    verbose: false
    display_time: false
